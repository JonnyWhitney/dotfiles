source = ~/.config/hypr/env.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/perms.conf
source = ~/.config/hypr/gestures.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/windows.conf

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1,
workspace = 3, monitor:eDP-1,
workspace = 4, monitor:eDP-1,

exec-once = uwsm app -- udiskie &
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- dunst

general {
    border_size = 4
    gaps_in = 2
    gaps_out = 2
    float_gaps = 2
    col.active_border = rgba(00ffffff)
    col.inactive_border = rgba(888888ff)
    layout = master
    snap {
        enabled = true
        respect_gaps = true
    }
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    repeat_rate =  100
    repeat_delay = 350

    sensitivity = 0.5
    accel_profile = flat
    touchpad {
        disable_while_typing = true
        natural_scroll = true
        clickfinger_behavior = true
        tap-to-click = false
    }
}

device {
    name = elan0686:00-04f3:320d-touchpad 
    sensitivity = 1
}
device { 
    name = tpps/2-elan-trackpoint 
    sensitivity = 0.5
}
device { 
    name = sigmamicro-lenovo-usb-optical-mouse
    sensitivity = -0.2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = CommitMono Nerd Font Mono

    vrr = 1
}

master {
    allow_small_split = true
    orientation = right
    mfact = 0.66
}

debug {
    disable_logs = false
}

